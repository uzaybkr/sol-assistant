<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Public+Sans:wght@600&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(700px 520px at 88% 30%,rgba(200,165,90,.32),transparent 62%),#08131f;color:#f3f1ec;font-family:"Public Sans",sans-serif;position:relative}
  .sun{position:absolute;right:120px;top:130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fbf4e0,#e6cf97 38%,#c8a55a 78%,#7d5f1e);box-shadow:0 0 120px rgba(200,165,90,.45)}

  .brand{display:flex;align-items:center;gap:16px;font:400 30px/1 "EB Garamond",serif;letter-spacing:.12em}
  .brand i{font-style:italic;letter-spacing:.02em;color:#e6cf97}
  h1{font:400 72px/1.04 "EB Garamond",serif;margin:auto 0 0;letter-spacing:-.01em}
  h1 em{color:#e6cf97}
  .foot{margin-top:34px;font:600 17px/1 "Public Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a9b2bd}
  .foot b{color:#c8a55a;font-weight:600}

</head>
<body>
  <div class="ring"></div><div class="sun"></div>
  <div class="in">

      <svg width="44" height="44" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efdcaa"/><stop offset=".6" stop-color="#c8a55a"/><stop offset="1" stop-color="#8a6a22"/></linearGradient></defs><path d="M20 3l14 5v10c0 9-6 16-14 19C12 34 6 27 6 18V8z" fill="url(#g)"/><circle cx="20" cy="19" r="6" fill="#08131f"/></svg>
      <span>ACME <i>CYBER</i></span>
    </div>
    <h1>Your business, <em>protected.</em><br>Watched 24/7.</h1>
    <div class="foot"><b>●</b>&nbsp; 24/7 US-based security monitoring</div>
  </div>
</body>
</html>
